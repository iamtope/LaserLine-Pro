<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Professional dark gradient -->
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Bright laser green -->
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0" />
      <stop offset="20%" style="stop-color:#00ff88;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#00ff88;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0" />
    </linearGradient>
    
    <!-- Red crosshair -->
    <linearGradient id="crosshair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="1024" rx="200" ry="200" fill="url(#background)"/>
  
  <!-- Laser level device -->
  <rect x="200" y="400" width="624" height="120" rx="60" ry="60" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
  
  <!-- Device screen -->
  <rect x="240" y="440" width="544" height="40" rx="20" ry="20" fill="rgba(0,0,0,0.5)"/>
  
  <!-- Horizontal laser line -->
  <line x1="100" y1="460" x2="924" y2="460" stroke="url(#laser)" stroke-width="10" filter="url(#glow)"/>
  
  <!-- Vertical laser line -->
  <line x1="512" y1="100" x2="512" y2="924" stroke="url(#laser)" stroke-width="10" filter="url(#glow)"/>
  
  <!-- Crosshair center -->
  <circle cx="512" cy="460" r="20" fill="url(#crosshair)" filter="url(#glow)"/>
  
  <!-- Crosshair lines -->
  <line x1="492" y1="460" x2="532" y2="460" stroke="url(#crosshair)" stroke-width="8" filter="url(#glow)"/>
  <line x1="512" y1="440" x2="512" y2="480" stroke="url(#crosshair)" stroke-width="8" filter="url(#glow)"/>
  
  <!-- Precision indicators -->
  <circle cx="350" cy="460" r="6" fill="#00ff88" opacity="0.9"/>
  <circle cx="674" cy="460" r="6" fill="#00ff88" opacity="0.9"/>
  <circle cx="512" cy="300" r="6" fill="#00ff88" opacity="0.9"/>
  <circle cx="512" cy="620" r="6" fill="#00ff88" opacity="0.9"/>
  
  <!-- Level indicators -->
  <rect x="420" y="400" width="184" height="8" rx="4" ry="4" fill="rgba(0,255,136,0.5)"/>
  <rect x="420" y="512" width="184" height="8" rx="4" ry="4" fill="rgba(0,255,136,0.5)"/>
  
  <!-- Subtle outer glow -->
  <circle cx="512" cy="460" r="300" fill="none" stroke="rgba(0,255,136,0.1)" stroke-width="4"/>
</svg>
